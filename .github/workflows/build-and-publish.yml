name: Build and Publish Package

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'PKGBUILD'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build package and create repository
        run: |
          # Run build in Arch Linux container
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -c '
              # Update system and install build dependencies
              pacman -Syu --noconfirm
              pacman -S --noconfirm base-devel git

              # Install linux-zen-headers (required for building ZFS kernel modules)
              pacman -S --noconfirm linux-zen-headers

              # Add custom repository to install zfs-utils
              echo "" >> /etc/pacman.conf
              echo "[zfs-custom]" >> /etc/pacman.conf
              echo "Server = https://jasonthagerty.github.io/zfs-utils/repo" >> /etc/pacman.conf
              echo "SigLevel = Optional TrustAll" >> /etc/pacman.conf

              # Install zfs-utils from custom repository
              pacman -Sy --noconfirm
              pacman -S --noconfirm zfs-utils || echo "zfs-utils not found, continuing anyway"

              # Create a build user (makepkg cannot run as root)
              useradd -m -G wheel builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              chown -R builder:builder /workspace

              # Build package
              su builder -c "cd /workspace && makepkg -s --noconfirm"

              # Create repo directory and move packages
              mkdir -p /workspace/repo
              mv /workspace/*.pkg.tar.zst /workspace/repo/

              # Download zfs-utils packages from the other repository
              cd /workspace/repo
              echo "Downloading zfs-utils packages from other repository..."

              # Try to download all .pkg.tar.zst files from zfs-utils repo
              # We parse the index.html to find package filenames
              curl -sL https://jasonthagerty.github.io/zfs-utils/repo/index.html | \
                grep -o "href=\"[^\"]*\.pkg\.tar\.zst\"" | \
                sed "s/href=\"//;s/\"//" | \
                while read -r pkg; do
                  echo "Downloading $pkg..."
                  curl -sL -O "https://jasonthagerty.github.io/zfs-utils/repo/$pkg" || echo "Failed to download $pkg"
                done

              # Create unified repository database with ALL packages
              cd /workspace/repo
              repo-add zfs-custom.db.tar.gz *.pkg.tar.zst

              # Prepare Pages directory structure
              cd /workspace
              mkdir -p _site
              cp -r repo _site/

              # Fix permissions for all files
              chmod -R 777 /workspace/_site
            '

      - name: Generate repository index
        run: |
          # Generate base HTML
          bash .github/workflows/generate-index.sh _site/repo/index.html

          # Generate package file list
          cd _site/repo
          PACKAGE_LIST=""
          shopt -s nullglob
          for file in *.pkg.tar.zst *.db.tar.gz *.db *.files.tar.gz *.files; do
            if [ -f "$file" ]; then
              PACKAGE_LIST="${PACKAGE_LIST}<li><a href=\"${file}\">${file}</a></li>
"
            fi
          done

          # Insert package list into HTML
          if [ -n "$PACKAGE_LIST" ]; then
            sed -i "s|<!-- Package list will be inserted here during build -->|${PACKAGE_LIST}|" index.html
          else
            sed -i "s|<!-- Package list will be inserted here during build -->|<li>No packages found</li>|" index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
