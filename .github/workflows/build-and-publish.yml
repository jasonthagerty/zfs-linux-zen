name: Build and Publish Package

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'PKGBUILD'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Wait for zfs-utils to be available
        run: |
          ZFS_VER=$(grep -m1 '_zfsver=' PKGBUILD | tr -d '"' | cut -d= -f2)
          echo "Required zfs-utils version: ${ZFS_VER}"
          for i in $(seq 1 20); do
            if curl -sL https://jasonthagerty.github.io/zfs-utils/repo/zfs-custom.db.tar.gz | tar -tz 2>/dev/null | grep -q "zfs-utils-${ZFS_VER}"; then
              echo "zfs-utils ${ZFS_VER} is available"
              exit 0
            fi
            echo "Attempt ${i}/20: zfs-utils ${ZFS_VER} not yet available, retrying in 30s..."
            sleep 30
          done
          echo "Timed out waiting for zfs-utils ${ZFS_VER}"
          exit 1

      - name: Build package and create repository
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -c '
              # Fail loudly if any build step fails (e.g. makepkg), instead of
              # silently publishing a repo that is missing the zfs-linux-zen packages
              set -e

              pacman -Syu --noconfirm
              pacman -S --noconfirm base-devel git
              pacman -S --noconfirm linux-zen-headers
              echo "" >> /etc/pacman.conf
              echo "[zfs-custom]" >> /etc/pacman.conf
              echo "Server = https://jasonthagerty.github.io/zfs-utils/repo" >> /etc/pacman.conf
              echo "SigLevel = Optional TrustAll" >> /etc/pacman.conf
              pacman -Sy --noconfirm
              pacman -S --noconfirm zfs-utils
              useradd -m -G wheel builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              chown -R builder:builder /workspace
              su builder -c "cd /workspace && makepkg -s --noconfirm"
              mkdir -p /workspace/repo
              mv /workspace/*.pkg.tar.zst /workspace/repo/
              cd /workspace/repo
              echo "Downloading zfs-utils packages from other repository..."
              curl -sL https://jasonthagerty.github.io/zfs-utils/repo/index.html | \
                grep -o "href=\"[^\"]*\.pkg\.tar\.zst\"" | \
                sed "s/href=\"//;s/\"$//" | \
                while read -r pkg; do
                  echo "Downloading $pkg..."
                  curl -sL -O "https://jasonthagerty.github.io/zfs-utils/repo/$pkg" || echo "Failed to download $pkg"
                done
              repo-add zfs-custom.db.tar.gz *.pkg.tar.zst
              cd /workspace
              mkdir -p _site
              cp -r repo _site/
              chmod -R 777 /workspace/_site
            '

      - name: Generate repository index
        run: |
          bash .github/workflows/generate-index.sh _site/repo/index.html
          cd _site/repo
          PACKAGE_LIST=""
          shopt -s nullglob
          for file in *.pkg.tar.zst *.db.tar.gz *.db *.files.tar.gz *.files; do
            if [ -f "$file" ]; then
              PACKAGE_LIST="${PACKAGE_LIST}<li><a href=\"${file}\">${file}</a></li>\n"
            fi
          done
          if [ -n "$PACKAGE_LIST" ]; then
            sed -i "s|<!-- Package list will be inserted here during build -->|${PACKAGE_LIST}|" index.html
          else
            sed -i "s|<!-- Package list will be inserted here during build -->|<li>No packages found</li>|" index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5